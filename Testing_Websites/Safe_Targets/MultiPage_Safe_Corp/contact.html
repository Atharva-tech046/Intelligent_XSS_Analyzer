<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Corp - Contact</title>
    <style>
        body { font-family: Arial; background: #e8f5e8; color: #2e7d32; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 10px; text-decoration: none; color: #2e7d32; }
        form { margin-top: 20px; }
        input { padding: 10px; width: 300px; margin-bottom: 10px; }
        button { padding: 10px; background: #2e7d32; color: white; border: none; }
        #response { margin-top: 20px; padding: 10px; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <nav>
            <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="contact.html">Contact</a>
        </nav>
        <form onsubmit="return false;">
            <input type="text" id="message" placeholder="Your message">
            <button onclick="submitForm()">Send</button>
        </form>
        <div id="response"></div>
    </div>
    <script>
        function submitForm() {
            const msg = document.getElementById('message').value;
            document.getElementById('response').textContent = 'Your message: ' + msg;
        }
    </script>
</body>
</html>
