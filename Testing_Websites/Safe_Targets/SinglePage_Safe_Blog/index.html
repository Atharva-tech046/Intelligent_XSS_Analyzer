<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Blog</title>
    <style>
        body { font-family: Arial; background: #e0f7fa; color: #00695c; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        input { padding: 10px; width: 200px; }
        button { padding: 10px; background: #004d40; color: white; border: none; }
        #results { margin-top: 20px; padding: 10px; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Safe Blog</h1>
        <input type="text" id="search" placeholder="Search...">
        <button onclick="search()">Search</button>
        <div id="results"></div>
    </div>
    <script>
        function search() {
            const query = document.getElementById('search').value;
            const results = document.getElementById('results');
            results.textContent = 'Search results for: ' + query;
        }
    </script>
</body>
</html>
