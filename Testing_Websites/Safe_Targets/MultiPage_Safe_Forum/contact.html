<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Contact</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e3f2fd; color: #0d47a1; }
        .page { max-width: 760px; margin: 0 auto; padding: 24px; }
        label, input, textarea, button { display: block; width: 100%; margin-bottom: 12px; }
        textarea { min-height: 120px; }
        #result { margin-top: 20px; padding: 16px; background: #fff; border: 1px solid #90caf9; }
    </style>
</head>
<body>
    <div class="page">
        <nav><a href="index.html">Home</a> <a href="topics.html">Topics</a> <a href="search.html">Search</a> <a href="contact.html">Contact</a></nav>
        <h1>Contact Us</h1>
        <form id="contact-form">
            <label>Name <input id="name" name="name" autocomplete="off"></label>
            <label>Message <textarea id="message" name="message"></textarea></label>
            <button type="submit">Send</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = escapeHtml(document.getElementById('name').value);
            const message = escapeHtml(document.getElementById('message').value);
            const result = document.getElementById('result');
            result.textContent = '';
            const nameEl = document.createElement('p');
            nameEl.textContent = `Name: ${name}`;
            const messageEl = document.createElement('p');
            messageEl.textContent = `Message: ${message}`;
            result.appendChild(nameEl);
            result.appendChild(messageEl);
        });
    </script>
</body>
</html>
